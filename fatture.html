<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Gestione Fatture — Regime forfettario</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f172a'/><path d='M9 8h11l3 3v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z' fill='none' stroke='%2338bdf8' stroke-width='1.6'/><path d='M11 14h9M11 17.5h9M11 21h6' stroke='%2338bdf8' stroke-width='1.4' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#0b0f1a; --bg-2:#121826; --surface:#151c2c; --surface-2:#1b2436;
  --line:#26314a; --line-2:#33415f;
  --ink:#e8edf7; --ink-soft:#9aa7c2; --ink-faint:#6b7a99;
  --accent:#38bdf8; --accent-2:#0ea5e9; --accent-deep:#075985;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --violet:#a78bfa;
  --r:14px; --r-sm:9px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.5;
  -webkit-font-smoothing:antialiased; font-size:15px}
a{color:var(--accent); text-decoration:none}
h1,h2,h3,h4{margin:0; font-weight:650; letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit}

/* layout */
.app{display:grid; grid-template-columns:236px 1fr; min-height:100%}
aside{background:var(--bg-2); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 18px; font-weight:700; font-size:1.05rem; letter-spacing:-.02em}
.brand .logo{width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--accent),var(--accent-deep)); display:grid; place-items:center; color:#04121f; font-weight:800}
.navbtn{display:flex; align-items:center; gap:11px; width:100%; text-align:left; background:transparent; border:0; color:var(--ink-soft);
  padding:10px 12px; border-radius:var(--r-sm); cursor:pointer; font-size:.94rem; transition:.13s}
.navbtn:hover{background:var(--surface); color:var(--ink)}
.navbtn.on{background:var(--surface-2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line-2)}
.navbtn .ic{width:18px; text-align:center; opacity:.85}
aside .spacer{flex:1}
aside .foot{font-size:.72rem; color:var(--ink-faint); padding:8px; line-height:1.4}

main{padding:26px 30px 70px; max-width:1120px; width:100%}
.head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap}
.head h1{font-size:1.5rem}
.head .sub{color:var(--ink-soft); font-size:.9rem; margin-top:3px}

/* cards */
.grid{display:grid; gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.app{grid-template-columns:1fr} aside{position:static; height:auto; flex-direction:row; flex-wrap:wrap; overflow:auto}
  .g4,.g3,.g2{grid-template-columns:1fr} aside .spacer,aside .foot{display:none} .brand{width:100%}}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px}
.card h3{font-size:1rem; margin-bottom:2px}
.card .sub{color:var(--ink-faint); font-size:.82rem; margin-bottom:14px}
.stat .k{color:var(--ink-soft); font-size:.82rem}
.stat .v{font-size:1.7rem; font-weight:700; letter-spacing:-.02em; margin-top:4px}
.stat .foot{font-size:.78rem; color:var(--ink-faint); margin-top:5px}
.v.good{color:var(--good)} .v.warn{color:var(--warn)} .v.accent{color:var(--accent)}

/* buttons */
.btn{display:inline-flex; align-items:center; gap:7px; font-size:.88rem; cursor:pointer; border-radius:100px; padding:9px 16px;
  border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink); transition:.14s}
.btn:hover{border-color:var(--accent); background:#1f2b40}
.btn-primary{background:linear-gradient(120deg,var(--accent),var(--accent-2)); color:#04121f; border:0; font-weight:650}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft)}
.btn-ghost:hover{background:var(--surface-2); border-color:transparent; color:var(--ink)}
.btn-sm{padding:6px 12px; font-size:.82rem}
.btn-danger:hover{border-color:var(--bad); color:var(--bad); background:transparent}

/* table */
table{width:100%; border-collapse:collapse; font-size:.9rem}
th{text-align:left; color:var(--ink-faint); font-weight:600; font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; padding:0 12px 10px}
td{padding:12px; border-top:1px solid var(--line); vertical-align:middle}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--surface-2)}
.pill{display:inline-block; padding:2px 10px; border-radius:100px; font-size:.76rem; font-weight:600}
.pill.paid{background:rgba(52,211,153,.14); color:var(--good)}
.pill.unpaid{background:rgba(251,191,36,.14); color:var(--warn)}
.empty{text-align:center; color:var(--ink-faint); padding:40px 20px; font-size:.9rem}

/* forms */
label{display:block; font-size:.8rem; color:var(--ink-soft); margin:0 0 5px}
input,select,textarea{font:inherit; font-size:.9rem; width:100%; padding:9px 11px; border-radius:var(--r-sm);
  border:1px solid var(--line-2); background:var(--bg-2); color:var(--ink); font-variant-numeric:tabular-nums}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent)}
textarea{resize:vertical; min-height:64px}
.frow{display:grid; gap:14px; margin-bottom:14px}
.f2{grid-template-columns:1fr 1fr} .f3{grid-template-columns:1fr 1fr 1fr} .f4{grid-template-columns:2fr 1fr 1fr 1fr}
@media(max-width:640px){.f2,.f3,.f4{grid-template-columns:1fr}}
.inl{position:relative}
.inl .u{position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:.85rem; pointer-events:none}
.inl input{padding-right:32px}
.chk{display:flex; align-items:center; gap:9px; font-size:.88rem; color:var(--ink-soft); cursor:pointer}
.chk input{width:auto}
.hint{font-size:.76rem; color:var(--ink-faint); margin-top:5px}
.seg{display:inline-flex; background:var(--bg-2); border:1px solid var(--line-2); border-radius:10px; padding:3px; gap:3px; flex-wrap:wrap}
.seg button{font:inherit; font-size:.82rem; cursor:pointer; border:0; background:transparent; color:var(--ink-soft); padding:6px 12px; border-radius:7px}
.seg button.on{background:var(--accent); color:#04121f; font-weight:650}
fieldset{border:0; padding:0; margin:0}

/* modal */
.modal-bg{position:fixed; inset:0; background:rgba(4,8,16,.68); backdrop-filter:blur(3px); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:34px 16px; overflow:auto}
.modal-bg.on{display:flex}
.modal{background:var(--surface); border:1px solid var(--line-2); border-radius:16px; width:100%; max-width:720px; padding:24px}
.modal h2{font-size:1.2rem; margin-bottom:4px}
.modal .msub{color:var(--ink-soft); font-size:.85rem; margin-bottom:18px}
.modal .actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px; flex-wrap:wrap}
.linehead{display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; font-size:.74rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; padding:0 2px 6px}
.lineitem{display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; margin-bottom:8px; align-items:center}
.lineitem .del{background:transparent; border:0; color:var(--ink-faint); cursor:pointer; font-size:1.1rem; padding:4px}
.lineitem .del:hover{color:var(--bad)}

.banner{border:1px solid var(--line-2); background:var(--surface-2); border-radius:12px; padding:13px 16px; font-size:.85rem; color:var(--ink-soft); display:flex; gap:10px; align-items:flex-start; margin-bottom:20px}
.banner b{color:var(--ink)}
.brk .row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); gap:14px}
.brk .row:last-child{border-bottom:0}
.brk .row.tot{border-top:1px solid var(--line-2); font-weight:650}
.brk .lbl{color:var(--ink-soft)} .brk .lbl small{display:block; color:var(--ink-faint); font-size:.75rem}
.brk .val{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.brk .val.tax{color:var(--warn)} .brk .val.inps{color:var(--accent)} .brk .val.net{color:var(--good)}
.sc{display:flex; gap:14px; padding:13px 0; border-bottom:1px solid var(--line)}
.sc:last-child{border-bottom:0}
.sc .dt{font-weight:650; color:var(--accent); min-width:96px}
.sc .amt{margin-left:auto; font-weight:650; font-variant-numeric:tabular-nums; white-space:nowrap}
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-2);
  border:1px solid var(--line-2); color:var(--ink); padding:11px 18px; border-radius:100px; font-size:.88rem; opacity:0; transition:.25s; z-index:80; pointer-events:none}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* print invoice */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block; position:absolute; inset:0; padding:0; color:#111; background:#fff}
}
.inv-doc{max-width:800px; margin:0 auto; padding:40px; color:#111; font-size:13px; background:#fff}
.inv-doc h2{font-size:20px}
.inv-doc .row{display:flex; justify-content:space-between; gap:30px; flex-wrap:wrap}
.inv-doc .box{border:1px solid #ccc; border-radius:8px; padding:12px 14px; min-width:230px; margin-top:14px}
.inv-doc .box .t{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:#777; margin-bottom:5px}
.inv-doc table{width:100%; margin-top:22px; font-size:12.5px}
.inv-doc th{color:#555; border-bottom:2px solid #333; padding:6px 4px; text-transform:none; letter-spacing:0}
.inv-doc td{border-top:1px solid #eee; padding:8px 4px; color:#111}
.inv-doc .totbox{margin-top:16px; margin-left:auto; width:280px}
.inv-doc .totbox .l{display:flex; justify-content:space-between; padding:5px 0}
.inv-doc .totbox .l.g{border-top:2px solid #333; font-weight:700; font-size:15px; margin-top:4px; padding-top:8px}
.inv-doc .legal{margin-top:28px; font-size:11px; color:#555; line-height:1.5; border-top:1px solid #eee; padding-top:14px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">€</span> Fatture</div>
    <button class="navbtn on" data-view="dashboard"><span class="ic">◱</span> Cruscotto</button>
    <button class="navbtn" data-view="invoices"><span class="ic">▤</span> Fatture</button>
    <button class="navbtn" data-view="clients"><span class="ic">☺</span> Clienti</button>
    <button class="navbtn" data-view="tax"><span class="ic">◕</span> Salvadanaio</button>
    <button class="navbtn" data-view="deadlines"><span class="ic">◷</span> Scadenze</button>
    <button class="navbtn" data-view="settings"><span class="ic">⚙</span> Impostazioni</button>
    <div class="spacer"></div>
    <div class="foot">Regime forfettario · dati salvati solo in questo browser · stima non fiscale.</div>
  </aside>
  <main id="view"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
(function(){
"use strict";
/* ============================== storage ============================== */
var K = { profile:'fd_profile_v1', clients:'fd_clients_v1', invoices:'fd_invoices_v1' };
function load(k, fb){ try{ var v=localStorage.getItem(k); return v==null?fb:JSON.parse(v); }catch(e){ return fb; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var DEFAULT_PROFILE = {
  businessName:'', vatNumber:'', fiscalCode:'', address:'', cap:'', city:'', province:'', country:'IT',
  iban:'', invoicePrefix:'', regimeStartYear: new Date().getFullYear(),
  coeff:78, taxRate:5, inpsType:'separata', inpsPct:26.07, cassaPct:4,
  fissi:4460, minimale:18555, eccPct:24, rid35:false,
  chargeBollo:false
};
var profile = Object.assign({}, DEFAULT_PROFILE, load(K.profile, {}));
var clients = load(K.clients, []);
var invoices = load(K.invoices, []);
var state = { view:'dashboard', taxYear:new Date().getFullYear() };

/* ============================== helpers ============================== */
function uid(){ return 'x'+Math.abs((Date.now()^(performance.now()*1000))|0).toString(36)+clients.length+invoices.length+Math.floor(performance.now()).toString(36); }
function num(v){ v=parseFloat(v); return isFinite(v)?v:0; }
function r2(v){ return Math.round(v*100)/100; }
var fmtEur = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'});
var fmtEur0 = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function eur(v){ return fmtEur.format(v||0); }
function eur0(v){ return fmtEur0.format(v||0); }
function pct(v){ return (Math.round(v*10)/10).toLocaleString('it-IT')+'%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function esx(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; var p=iso.split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function yearOf(iso){ return iso? parseInt(iso.slice(0,4),10) : new Date().getFullYear(); }
function invoiceTotal(inv){ return r2((inv.lines||[]).reduce(function(a,l){ return a+num(l.qty)*num(l.price); },0)); }
function clientName(id){ var c=clients.find(function(x){return x.id===id;}); return c? c.name : '—'; }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2200); }

/* imposta sostitutiva 5% valida per i primi 5 anni dall'inizio attività */
function effectiveTaxRate(year){
  var start=num(profile.regimeStartYear)||year;
  if (num(profile.taxRate)===5 && (year-start)>=5) return 15; // finestra startup scaduta
  return num(profile.taxRate);
}
function inpsMarginalPct(){
  if(profile.inpsType==='separata') return num(profile.inpsPct);
  if(profile.inpsType==='cassa') return num(profile.cassaPct);
  return num(profile.eccPct)*(profile.rid35?0.65:1);
}

/* calcolo fiscale su un anno, dagli incassi (fatture) */
function taxCompute(year){
  var lordo = invoices.filter(function(i){ return yearOf(i.date)===year; })
                      .reduce(function(a,i){ return a+invoiceTotal(i); },0);
  var coeff=num(profile.coeff)/100;
  var imponibile=lordo*coeff;
  var rate=effectiveTaxRate(year);
  var imposta=imponibile*(rate/100);
  var inps=0, inpsLbl='';
  if(profile.inpsType==='separata'||profile.inpsType==='cassa'){
    var al=profile.inpsType==='separata'?num(profile.inpsPct):num(profile.cassaPct);
    inps=imponibile*(al/100);
    inpsLbl=(profile.inpsType==='separata'?'Gestione Separata ':'Cassa ')+pct(al)+' sull’imponibile';
  } else {
    var rid=profile.rid35?0.65:1;
    var fissi=num(profile.fissi)*rid;
    var ecc=Math.max(0,imponibile-num(profile.minimale))*(num(profile.eccPct)/100)*rid;
    inps=fissi+ecc;
    inpsLbl='fissi '+eur0(fissi)+' + '+pct(num(profile.eccPct))+' sull’eccedenza'+(profile.rid35?' (−35%)':'');
  }
  var due=imposta+inps, net=lordo-due;
  var margPct=coeff*(rate+inpsMarginalPct());
  return {year:year, lordo:lordo, imponibile:imponibile, rate:rate, imposta:imposta, inps:inps, inpsLbl:inpsLbl, due:due, net:net, margPct:margPct};
}

/* incassato per mese di un anno (12 valori) */
function monthlyTotals(year){
  var arr=new Array(12).fill(0);
  invoices.forEach(function(i){ if(yearOf(i.date)===year){ var m=parseInt((i.date||'').slice(5,7),10)-1; if(m>=0&&m<12) arr[m]+=invoiceTotal(i); } });
  return arr;
}
var MO=['G','F','M','A','M','G','L','A','S','O','N','D'];
function barChart(year){
  var data=monthlyTotals(year), max=Math.max.apply(null,data.concat([1]));
  var W=600,H=156,pad=6,base=H-22,top=22, slot=(W-pad*2)/12, bw=slot*0.56;
  var bars=data.map(function(v,i){
    var h=v>0?Math.max(3,(v/max)*(base-top)):0, x=pad+i*slot+(slot-bw)/2, y=base-h;
    var lbl=v>0?'<text x="'+(x+bw/2)+'" y="'+(y-5)+'" fill="var(--ink-soft)" font-size="10" text-anchor="middle" font-family="var(--font)">'+eur0(v).replace(/\s?€/,'')+'</text>':'';
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+(v>0?'url(#bg)':'var(--line)')+'"/>'+lbl
      +'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" fill="var(--ink-faint)" font-size="10" text-anchor="middle" font-family="var(--font)">'+MO[i]+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Incassato mensile '+year+'">'
    +'<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-deep)"/></linearGradient></defs>'
    +'<line x1="'+pad+'" y1="'+base+'" x2="'+(W-pad)+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>'+bars+'</svg>';
}

/* acconti metodo storico: acconto anno successivo = 100% imposta dell'anno */
function accontiCompute(imposta){
  var tot=imposta;
  if(tot<=51.65) return {tot:0, mode:'none', rata1:0, rata2:0};
  if(tot<=257.52) return {tot:r2(tot), mode:'single', rata1:0, rata2:r2(tot)};
  return {tot:r2(tot), mode:'two', rata1:r2(tot*0.4), rata2:r2(tot*0.6)};
}

/* ============================== router ============================== */
function go(v){ state.view=v; document.querySelectorAll('.navbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.view===v); }); render(); window.scrollTo(0,0); }
document.querySelectorAll('.navbtn').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.view); }); });

function render(){
  var el=document.getElementById('view');
  if(state.view==='dashboard') el.innerHTML=viewDashboard();
  else if(state.view==='invoices') el.innerHTML=viewInvoices();
  else if(state.view==='clients') el.innerHTML=viewClients();
  else if(state.view==='tax') el.innerHTML=viewTax();
  else if(state.view==='deadlines') el.innerHTML=viewDeadlines();
  else if(state.view==='settings') el.innerHTML=viewSettings();
  wire();
}

/* ============================== views ============================== */
function needProfileBanner(){
  if(profile.businessName && profile.vatNumber) return '';
  return '<div class="banner"><span>👋</span><span>Benvenuto. Inizia da <b>Impostazioni</b>: inserisci i tuoi dati (P.IVA, ATECO, cassa) — servono per le fatture e per il calcolo delle tasse.</span></div>';
}

function viewDashboard(){
  var y=new Date().getFullYear();
  var t=taxCompute(y);
  var yInv=invoices.filter(function(i){return yearOf(i.date)===y;});
  var unpaid=invoices.filter(function(i){return !i.paid;});
  var unpaidTot=unpaid.reduce(function(a,i){return a+invoiceTotal(i);},0);
  var next=nextDeadline();
  var recent=invoices.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');}).slice(0,6);
  return needProfileBanner()+
  '<div class="head"><div><h1>Cruscotto</h1><div class="sub">Anno '+y+' · '+yInv.length+' fatture emesse</div></div>'
   +'<button class="btn btn-primary" data-act="newInvoice">+ Nuova fattura</button></div>'
  +'<div class="grid g4" style="margin-bottom:16px">'
    +stat('Incassato '+y, eur0(t.lordo), yInv.length+' fatture','accent')
    +stat('Da accantonare', eur0(t.due), pct(t.margPct)+' di ogni fattura','warn')
    +stat('Netto stimato', eur0(t.net), 'dopo tasse e contributi','good')
    +stat('Da incassare', eur0(unpaidTot), unpaid.length+' fatture non pagate','')
  +'</div>'
  +'<div class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Andamento incassi '+y+'</h3>'
    +'<span style="color:var(--ink-faint);font-size:.82rem">totale '+eur0(t.lordo)+'</span></div>'
    +'<div class="sub">incassato per mese, dalle fatture emesse</div>'

      +'<div class="row tot"><div class="lbl">Totale acconti '+ny+'</div><div class="val">'+eur(acc.tot)+'</div></div></div>';

function nextDeadline(){
  var now=new Date(), y=now.getFullYear();
  var list=[
    {d:new Date(y,5,30), dt:'30 giu '+y, ds:'Saldo imposta '+(y-1)+' + 1° acconto '+y, key:'giu'},
    {d:new Date(y,10,30), dt:'30 nov '+y, ds:'2° acconto imposta '+y, key:'nov'},
    {d:new Date(y+1,5,30), dt:'30 giu '+(y+1), ds:'Saldo imposta '+y+' + 1° acconto '+(y+1), key:'giu'}
  ];
  for(var i=0;i<list.length;i++){ if(list[i].d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())) return list[i]; }
  return list[list.length-1];
}

function readLines(){
  return Array.prototype.map.call(document.querySelectorAll('#i_lines [data-line]'), function(row){
    return { desc:row.querySelector('.l_desc').value.trim(), qty:num(row.querySelector('.l_qty').value), price:num(row.querySelector('.l_price').value) };
  }).filter(function(l){ return l.desc || l.price; });
}
function refreshInvoiceTotal(){
  var lines=readLines(); var tot=lines.reduce(function(a,l){return a+l.qty*l.price;},0);
  var bollo=(tot>77.47 && profile.chargeBollo)?2:0;
  var el=document.getElementById('i_total');
  if(el) el.innerHTML='Totale: '+eur(tot+bollo)+(tot>77.47?'<div style="font-size:.75rem;color:var(--ink-faint);font-weight:400">bollo €2,00 '+(profile.chargeBollo?'addebitato':'a tuo carico')+'</div>':'');
}
function saveInvoiceFromForm(id){
  if(!clients.length){ toast('Crea prima un cliente'); return; }
  var lines=readLines();
  if(!lines.length){ toast('Aggiungi almeno una riga'); return; }
  var data={ number:val('i_number'), date:val('i_date')||todayISO(), clientId:document.getElementById('i_client').value,
    lines:lines, notes:val('i_notes'), paid:document.getElementById('i_paid').checked };
  if(!data.number){ toast('Serve il numero fattura'); return; }
  if(id){ var inv=invoices.find(function(x){return x.id===id;}); Object.assign(inv,data); }
  else { data.id=uid(); data.created=todayISO(); invoices.push(data); }
  save(K.invoices, invoices); closeModal(); toast('Fattura salvata'); render();
}

function invoiceDetail(inv){
  var c=clients.find(function(x){return x.id===inv.clientId;})||{};
  var tot=invoiceTotal(inv);
  var bollo=(tot>77.47)?2:0;
  var grand=tot+((profile.chargeBollo)?bollo:0);
  return '<h2>Fattura '+esc(inv.number)+'</h2><div class="msub">'+fmtDate(inv.date)+' · '+esc(c.name||'—')+'</div>'
    +'<div class="brk">'
      +brow('Imponibile', eur(tot),'operazione esente IVA (forfettario)','')
      +(bollo?brow('Marca da bollo', eur(bollo), profile.chargeBollo?'addebitata al cliente':'a tuo carico (obbligo > €77,47)',''):'')
      +'<div class="row tot"><div class="lbl">Totale documento</div><div class="val">'+eur(grand)+'</div></div>'
    +'</div>'
    +'<div class="actions" style="justify-content:space-between"><div style="display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="btn btn-sm" data-togglepaid="'+inv.id+'">'+(inv.paid?'Segna da incassare':'Segna incassata')+'</button>'
      +'<button class="btn btn-sm btn-ghost" data-editinvoice="'+inv.id+'">Modifica</button></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap">'
      +'<button class="btn btn-sm" data-print="'+inv.id+'">🖨 Stampa / PDF</button>'
      +'<button class="btn btn-sm btn-primary" data-xml="'+inv.id+'">⭳ XML SDI</button></div></div>';
}

/* ============================== print & XML ============================== */
function printInvoice(inv){
  var c=clients.find(function(x){return x.id===inv.clientId;})||{};
  var tot=invoiceTotal(inv), bollo=(tot>77.47)?2:0, grand=tot+(profile.chargeBollo?bollo:0);
  var rows=(inv.lines||[]).map(function(l){ return '<tr><td>'+esc(l.desc)+'</td><td style="text-align:right">'+num(l.qty).toLocaleString('it-IT')+'</td>'
    +'<td style="text-align:right">'+eur(num(l.price))+'</td><td style="text-align:right">'+eur(num(l.qty)*num(l.price))+'</td></tr>'; }).join('');
  document.getElementById('printArea').innerHTML=
    '<div class="inv-doc"><div class="row"><div><h2>'+esc(profile.businessName||'—')+'</h2>'
     +'<div style="color:#555;margin-top:4px">'+esc(profile.address)+(profile.cap?' · '+esc(profile.cap):'')+' '+esc(profile.city)+(profile.province?' ('+esc(profile.province)+')':'')+'<br>'
     +'P.IVA '+esc(profile.vatNumber||'—')+(profile.fiscalCode?' · CF '+esc(profile.fiscalCode):'')+'</div></div>'
     +'<div style="text-align:right"><div style="font-size:22px;font-weight:700">FATTURA</div><div style="color:#555;margin-top:4px">N. '+esc(inv.number)+'<br>del '+fmtDate(inv.date)+'</div></div></div>'
    +'<div class="box"><div class="t">Destinatario</div><b>'+esc(c.name||'—')+'</b><br>'
     +esc(c.address||'')+(c.cap?' · '+esc(c.cap):'')+' '+esc(c.city||'')+(c.province?' ('+esc(c.province)+')':'')+'<br>'
     +(c.vat?'P.IVA '+esc(c.vat):'')+(c.fiscalCode?(c.vat?' · ':'')+'CF '+esc(c.fiscalCode):'')+'</div>'
    +'<table><thead><tr><th>Descrizione</th><th style="text-align:right">Q.tà</th><th style="text-align:right">Prezzo</th><th style="text-align:right">Importo</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="totbox"><div class="l"><span>Imponibile</span><span>'+eur(tot)+'</span></div>'
     +'<div class="l"><span>IVA</span><span>esente</span></div>'
     +(bollo?'<div class="l"><span>Marca da bollo</span><span>'+eur(bollo)+(profile.chargeBollo?'':' *')+'</span></div>':'')
     +'<div class="l g"><span>Totale</span><span>'+eur(grand)+'</span></div></div>'
    +(inv.notes?'<div style="margin-top:18px;color:#333"><b>Note:</b> '+esc(inv.notes)+'</div>':'')
    +'<div class="legal">Operazione effettuata ai sensi dell’art. 1, commi da 54 a 89, della Legge n. 190/2014 e successive modifiche — regime forfettario. Non soggetta a IVA. '
     +'Non soggetta a ritenuta d’acconto ai sensi dell’art. 1, comma 67, della Legge n. 190/2014.'
     +(bollo?'<br>Imposta di bollo da €2,00 assolta '+(profile.chargeBollo?'e addebitata in fattura':'sull’originale')+' (art. 6 Tabella B DPR 642/1972 — importo > €77,47).':'')
     +(profile.iban?'<br>Pagamento: IBAN '+esc(profile.iban):'')+'</div></div>';
  setTimeout(function(){ window.print(); }, 60);
}

function xmlSDINumber(n){ n=(n||1); var s='00000'+(n).toString(36).toUpperCase(); return s.slice(-5); }
function decForXml(v){ return (Math.round(v*100)/100).toFixed(2); }
function generateXML(inv){
  var c=clients.find(function(x){return x.id===inv.clientId;})||{};
  var tot=invoiceTotal(inv), bollo=(tot>77.47)?2:0;
  var grand=tot+(profile.chargeBollo?bollo:0);
  var piva=(profile.vatNumber||'').replace(/^IT/i,'').replace(/\s/g,'');
  var prog=xmlSDINumber(invoices.indexOf(inv)+1);
  var sdi=(c.sdiCode&&c.sdiCode.length===7)?c.sdiCode:'0000000';
  var lines=(inv.lines||[]).map(function(l,i){
    return '      <DettaglioLinee>\n'
      +'        <NumeroLinea>'+(i+1)+'</NumeroLinea>\n'
      +'        <Descrizione>'+esx(l.desc||'-')+'</Descrizione>\n'
      +'        <Quantita>'+decForXml(num(l.qty))+'</Quantita>\n'
      +'        <PrezzoUnitario>'+decForXml(num(l.price))+'</PrezzoUnitario>\n'
      +'        <PrezzoTotale>'+decForXml(num(l.qty)*num(l.price))+'</PrezzoTotale>\n'
      +'        <AliquotaIVA>0.00</AliquotaIVA>\n        <Natura>N2.2</Natura>\n'
      +'      </DettaglioLinee>';
  }).join('\n');
  var clientAnag = c.vat
    ? '        <IdFiscaleIVA><IdPaese>IT</IdPaese><IdCodice>'+esx(c.vat.replace(/^IT/i,''))+'</IdCodice></IdFiscaleIVA>\n'
    : (c.fiscalCode?'        <CodiceFiscale>'+esx(c.fiscalCode)+'</CodiceFiscale>\n':'');
  var xml='<?xml version="1.0" encoding="UTF-8"?>\n'
   +'<p:FatturaElettronica versione="FPR12" xmlns:p="http://ivaservizi.agenziaentrate.gov.it/docs/xsd/fatture/v1.2" xmlns:ds="http://www.w3.org/2000/09/xmldsig#" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">\n'
   +'  <FatturaElettronicaHeader>\n'
   +'    <DatiTrasmissione>\n'
   +'      <IdTrasmittente><IdPaese>IT</IdPaese><IdCodice>'+esx(piva||'0000000000')+'</IdCodice></IdTrasmittente>\n'
   +'      <ProgressivoInvio>'+prog+'</ProgressivoInvio>\n'
   +'      <FormatoTrasmissione>FPR12</FormatoTrasmissione>\n'
   +'      <CodiceDestinatario>'+esx(sdi)+'</CodiceDestinatario>\n'
   +(sdi==='0000000'&&c.pec?'      <PECDestinatario>'+esx(c.pec)+'</PECDestinatario>\n':'')
   +'    </DatiTrasmissione>\n'
   +'    <CedentePrestatore>\n      <DatiAnagrafici>\n'
   +'        <IdFiscaleIVA><IdPaese>IT</IdPaese><IdCodice>'+esx(piva||'0000000000')+'</IdCodice></IdFiscaleIVA>\n'
   +(profile.fiscalCode?'        <CodiceFiscale>'+esx(profile.fiscalCode)+'</CodiceFiscale>\n':'')
   +'        <Anagrafica><Denominazione>'+esx(profile.businessName||'-')+'</Denominazione></Anagrafica>\n'
   +'        <RegimeFiscale>RF19</RegimeFiscale>\n      </DatiAnagrafici>\n'
   +'      <Sede><Indirizzo>'+esx(profile.address||'-')+'</Indirizzo><CAP>'+esx(profile.cap||'00000')+'</CAP><Comune>'+esx(profile.city||'-')+'</Comune>'+(profile.province?'<Provincia>'+esx(profile.province)+'</Provincia>':'')+'<Nazione>IT</Nazione></Sede>\n'
   +'    </CedentePrestatore>\n'
   +'    <CessionarioCommittente>\n      <DatiAnagrafici>\n'+clientAnag
   +'        <Anagrafica><Denominazione>'+esx(c.name||'-')+'</Denominazione></Anagrafica>\n      </DatiAnagrafici>\n'
   +'      <Sede><Indirizzo>'+esx(c.address||'-')+'</Indirizzo><CAP>'+esx(c.cap||'00000')+'</CAP><Comune>'+esx(c.city||'-')+'</Comune>'+(c.province?'<Provincia>'+esx(c.province)+'</Provincia>':'')+'<Nazione>IT</Nazione></Sede>\n'
   +'    </CessionarioCommittente>\n'
   +'  </FatturaElettronicaHeader>\n'
   +'  <FatturaElettronicaBody>\n    <DatiGenerali>\n      <DatiGeneraliDocumento>\n'
   +'        <TipoDocumento>TD01</TipoDocumento>\n        <Divisa>EUR</Divisa>\n        <Data>'+esx(inv.date)+'</Data>\n        <Numero>'+esx(inv.number)+'</Numero>\n'
   +(bollo?'        <DatiBollo><BolloVirtuale>SI</BolloVirtuale><ImportoBollo>2.00</ImportoBollo></DatiBollo>\n':'')
   +'        <ImportoTotaleDocumento>'+decForXml(grand)+'</ImportoTotaleDocumento>\n      </DatiGeneraliDocumento>\n    </DatiGenerali>\n'
   +'    <DatiBeniServizi>\n'+lines+'\n'
   +'      <DatiRiepilogo>\n        <AliquotaIVA>0.00</AliquotaIVA>\n        <Natura>N2.2</Natura>\n        <ImponibileImporto>'+decForXml(tot)+'</ImponibileImporto>\n        <Imposta>0.00</Imposta>\n'
   +'        <RiferimentoNormativo>Operazione non soggetta a IVA - regime forfettario art.1 c.54-89 L.190/2014</RiferimentoNormativo>\n      </DatiRiepilogo>\n'
   +'    </DatiBeniServizi>\n  </FatturaElettronicaBody>\n</p:FatturaElettronica>\n';
  var fname='IT'+(piva||'0000000000')+'_'+prog+'.xml';
  download(fname, xml, 'application/xml');
  toast('XML generato — validalo sul portale AdE prima di inviarlo');
}
function download(name, content, type){
  var blob=new Blob([content],{type:type||'text/plain'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 100);
}

/* ============================== settings persistence ============================== */
function saveProfileFromForm(){
  ['businessName','vatNumber','fiscalCode','iban','address','cap','city','province','invoicePrefix'].forEach(function(f){ profile[f]=val('p_'+f); });
  profile.coeff=num(val('p_coeff')); profile.regimeStartYear=num(val('p_regimeStartYear'))||new Date().getFullYear();
  profile.chargeBollo=document.getElementById('p_chargeBollo').checked;
  if(profile.inpsType==='cassa') profile.cassaPct=num(val('p_inpsPct')); else if(profile.inpsType!=='artigiani') profile.inpsPct=num(val('p_inpsPct'));
  if(profile.inpsType==='artigiani'){ profile.fissi=num(val('p_fissi')); profile.minimale=num(val('p_minimale')); profile.eccPct=num(val('p_eccPct')); profile.rid35=document.getElementById('p_rid35').checked; }
  save(K.profile, profile); toast('Impostazioni salvate'); render();
}

/* ============================== wiring ============================== */
function wire(){
  var el=document.getElementById('view');
  el.querySelectorAll('[data-view-link]').forEach(function(b){ b.addEventListener('click', function(){ go(b.dataset.viewLink); }); });
  el.querySelectorAll('[data-open]').forEach(function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); var inv=invoices.find(function(x){return x.id===b.dataset.open;}); if(inv) openModal(invoiceDetail(inv)); }); });
  var seg=document.getElementById('taxYearSeg'); if(seg) seg.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ state.taxYear=num(b.dataset.ty); render(); }); });

  el.querySelectorAll('[data-act]').forEach(function(b){ b.addEventListener('click', function(){ act(b.dataset.act); }); });

  // settings live segments
  var trSeg=document.getElementById('taxRateSeg'); if(trSeg) trSeg.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ profile.taxRate=num(b.dataset.tr); trSeg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);}); }); });
  var inpsSeg=document.getElementById('inpsSeg'); if(inpsSeg) inpsSeg.querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ profile.inpsType=b.dataset.inps; render(); }); });
  el.querySelectorAll('[data-editclient]').forEach(function(b){ b.addEventListener('click', function(){ openModal(clientForm(clients.find(function(x){return x.id===b.dataset.editclient;}))); }); });
  el.querySelectorAll('[data-delclient]').forEach(function(b){ b.addEventListener('click', function(){ if(confirm('Eliminare il cliente?')){ clients=clients.filter(function(x){return x.id!==b.dataset.delclient;}); save(K.clients,clients); render(); } }); });
  var imp=document.getElementById('importFile'); if(imp) imp.addEventListener('change', doImport);
}
document.getElementById('modal').addEventListener('click', modalClicks);
function modalClicks(e){
  var t=e.target.closest('[data-close],[data-saveclient],[data-saveinvoice],[data-addline],[data-delline],[data-delinvoice],[data-editinvoice],[data-togglepaid],[data-print],[data-xml]');
  if(!t) return;
  if(t.hasAttribute('data-close')) return closeModal();
  if(t.hasAttribute('data-saveclient')) return saveClientFromForm(t.dataset.saveclient);
  if(t.hasAttribute('data-saveinvoice')) return saveInvoiceFromForm(t.dataset.saveinvoice);
  if(t.hasAttribute('data-addline')){ document.getElementById('i_lines').insertAdjacentHTML('beforeend', lineRow({desc:'',qty:1,price:0})); refreshInvoiceTotal(); return; }
  if(t.hasAttribute('data-delline')){ t.closest('[data-line]').remove(); refreshInvoiceTotal(); return; }
  if(t.hasAttribute('data-delinvoice')){ if(confirm('Eliminare la fattura?')){ invoices=invoices.filter(function(x){return x.id!==t.dataset.delinvoice;}); save(K.invoices,invoices); closeModal(); render(); } return; }
  if(t.hasAttribute('data-editinvoice')){ var inv=invoices.find(function(x){return x.id===t.dataset.editinvoice;}); openModal(invoiceForm(inv)); bindInvoiceForm(); return; }
  if(t.hasAttribute('data-togglepaid')){ var iv=invoices.find(function(x){return x.id===t.dataset.togglepaid;}); iv.paid=!iv.paid; save(K.invoices,invoices); openModal(invoiceDetail(iv)); render(); return; }
  if(t.hasAttribute('data-print')){ printInvoice(invoices.find(function(x){return x.id===t.dataset.print;})); return; }
  if(t.hasAttribute('data-xml')){ generateXML(invoices.find(function(x){return x.id===t.dataset.xml;})); return; }
}
document.getElementById('modal').addEventListener('input', function(e){ if(e.target.closest('#i_lines')) refreshInvoiceTotal(); });

function bindInvoiceForm(){ refreshInvoiceTotal(); }

function act(a){
  if(a==='newInvoice'){ if(!clients.length){ toast('Crea prima un cliente'); go('clients'); return; } openModal(invoiceForm()); bindInvoiceForm(); }
  else if(a==='newClient'){ openModal(clientForm()); }
  else if(a==='saveProfile'){ saveProfileFromForm(); }
  else if(a==='exportData'){ download('fatture-backup-'+todayISO()+'.json', JSON.stringify({profile:profile,clients:clients,invoices:invoices},null,2), 'application/json'); }
  else if(a==='importData'){ document.getElementById('importFile').click(); }
  else if(a==='wipe'){ if(confirm('Cancellare TUTTI i dati (profilo, clienti, fatture)? Operazione irreversibile.')){ localStorage.removeItem(K.profile); localStorage.removeItem(K.clients); localStorage.removeItem(K.invoices); profile=Object.assign({},DEFAULT_PROFILE); clients=[]; invoices=[]; render(); toast('Dati cancellati'); } }
}
function doImport(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){ try{ var d=JSON.parse(rd.result);
      if(d.profile) profile=Object.assign({},DEFAULT_PROFILE,d.profile);
      if(Array.isArray(d.clients)) clients=d.clients;
      if(Array.isArray(d.invoices)) invoices=d.invoices;
      save(K.profile,profile); save(K.clients,clients); save(K.invoices,invoices); render(); toast('Backup importato');
    }catch(err){ toast('File non valido'); } };
  rd.readAsText(f);
}

/* re-bind invoice form total when opening new invoice (input event covers edits) */
var _openModal=openModal;
openModal=function(html){ _openModal(html); if(document.getElementById('i_lines')) refreshInvoiceTotal(); };

render();
})();
</script>
